  ['Throw 35%', { combat: true, act: 'Throw', at: 0.35 }],
  ['Throw 65%', { combat: true, act: 'Throw', at: 0.65 }],
  ['Victory', { combat: true, act: 'Victory', at: 0.5 }],
  ['Downed', { combat: true, loop: 'Downed' }],

const DURS = { Dodge: 0.42, Hit: 0.4, BigHit: 0.7, Throw: 0.5, Lift: 0.75, Receive: 0.4, Victory: 1.3, Place: 0.85, Pet: 1.9, Feed: 1.6, Pickup: 1.7, Wave: 1.6, Tap: 0.55, Startle: 0.7, GetIn: 0.45, GetOut: 0.45 };

// ---------------------------------------------------------------- render
const only = q.get('only'), rigSel = q.get('rig');
const cells = [];
for (const [label, S] of CELLS) for (const [rn, def] of [['R6', rigR6], ['R15', rigR15]]) {

while (innerWidth < 50 || innerHeight < 50) await new Promise((r) => setTimeout(r, 50)); // pane may start at 0x0
const cols = +(q.get('cols') || 8);
const rows = Math.ceil(cells.length / cols);

renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const yaw = +(q.get('yaw') ?? 35) * Math.PI / 180;
const COL = { HRP: null, Torso: '#3d7bd9', UpperTorso: '#3d7bd9', LowerTorso: '#2d5fb0', Head: '#f2c94c' };
const colorOf = (n) => COL[n] !== undefined ? COL[n] : (/Leg|Foot/.test(n) ? '#2f9e5b' : '#f2c94c');
const lbl = document.getElementById('labels');
const cw = innerWidth / cols, ch = innerHeight / rows;
cells.forEach((cell, i) => {

  scene.add(new THREE.HemisphereLight('#ffffff', '#445', 1.6));
  const sun = new THREE.DirectionalLight('#fff', 1.6); sun.position.set(4, 8, -6); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.BoxGeometry(8, 0.05, 8), new THREE.MeshStandardMaterial({ color: '#566b4a' }));
  ground.position.y = rig.Ground - 0.025; scene.add(ground);

    const s = cell.def().parts[name];
    const m = new THREE.Mesh(new THREE.BoxGeometry(s[0] * 0.98, s[1] * 0.98, s[2] * 0.98), new THREE.MeshStandardMaterial({ color: col, roughness: 0.6 }));
    m.matrixAutoUpdate = false; m.matrix.copy(cf.m); scene.add(m);
    if (name === 'Head') { const face = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.18, 0.05), new THREE.MeshStandardMaterial({ color: '#222' })); face.position.set(0, 0, -s[2] / 2); m.add(face); }
  }
  if (rig.EggSpot) {
    const tcf = cfs[rig.Torso].mul(CF.pos(rig.EggSpot));
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), new THREE.MeshStandardMaterial({ color: '#f4efe2', transparent: true, opacity: 0.85 }));
    e.scale.set(rig.EggSize.x, rig.EggSize.y, rig.EggSize.z); e.matrixAutoUpdate = false; e.updateMatrix(); e.matrix.premultiply(tcf.m); scene.add(e);
  }
  if (rig.PlaceWorld) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), new THREE.MeshStandardMaterial({ color: '#f4efe2', transparent: true, opacity: 0.85 }));
    e.scale.set(rig.PlaceSize.x, rig.PlaceSize.y, rig.PlaceSize.z); e.position.copy(rig.PlaceWorld); scene.add(e);
  }
  for (const p of rig.Targets || []) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), new THREE.MeshBasicMaterial({ color: '#ff3355' })); m.position.copy(p); scene.add(m); }
  if (cell.S.wheel) {
    const W = cell.S.wheel; const ring = new THREE.Mesh(new THREE.TorusGeometry(W.r, 0.07, 8, 24), new THREE.MeshStandardMaterial({ color: '#222' }));
    ring.position.copy(W.pos); ring.lookAt(W.pos.clone().add(W.axis)); scene.add(ring);
  }
  const cam = new THREE.PerspectiveCamera(32, cw / ch, 0.1, 100);
  cam.fov = 2 * Math.atan(4.6 / (2 * 16) / Math.min(1, cw / ch)) * 180 / Math.PI; cam.updateProjectionMatrix();
  const d = 16, camY = +(q.get('camy') ?? 2.5); cam.position.set(-Math.sin(yaw) * d, camY, -Math.cos(yaw) * d); cam.lookAt(0, -0.3, 0);
  const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
  renderer.setViewport(x, innerHeight - y - ch, cw, ch); renderer.setScissor(x, innerHeight - y - ch, cw, ch);
  renderer.render(scene, cam);
  const div = document.createElement('div'); div.textContent = cell.label; div.style.left = (x + 4) + 'px'; div.style.top = (y + 3) + 'px'; lbl.appendChild(div);
});
window.__done = true;
Object.assign(window, { bind, rigR6, rigR15, simulate, place, fk, CF, V, THREE });
</script>
