<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HUD Mock</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --ink: #101a13; }
  html, body { margin: 0; background: #2e6b3a; }
  body { width: 1000px; height: 560px; position: relative; overflow: hidden; font-family: 'Fredoka One', sans-serif;
    background: linear-gradient(#1b2a5a 0, #23356b 40%, #2f7a3e 41%, #2b6e37 100%); }
  .t { color: #fff; -webkit-text-stroke: 0; paint-order: stroke fill; text-shadow:
      -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
      0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), 0 5px 0 var(--ink); }
  .px { font-family: 'Press Start 2P', monospace; }
  .btn { position: absolute; border: 3.5px solid var(--ink); border-radius: 14px; box-sizing: border-box; overflow: hidden; }
  .btn::before { content: ''; position: absolute; inset: 3px; border: 2px solid rgba(255,255,255,.65); border-radius: 10px; }
  .btn::after { content: ''; position: absolute; inset: 0; background:
      repeating-linear-gradient(120deg, transparent 0 46px, rgba(255,255,255,.18) 46px 60px, transparent 60px 70px, rgba(255,255,255,.12) 70px 76px); }
  .green  { background: linear-gradient(#8cf05a 0 48%, #4fcf3a 52% 100%); }
  .blue   { background: linear-gradient(#6ecbff 0 48%, #2f8de8 52% 100%); }
  .red    { background: linear-gradient(#ff7a6a 0 48%, #e63b3b 52% 100%); }
  .yellow { background: linear-gradient(#ffe76a 0 48%, #ffc21f 52% 100%); }
  .orange { background: linear-gradient(#ffb25a 0 48%, #ff7f1f 52% 100%); }
  .purple { background: linear-gradient(#b98bff 0 48%, #7c45e8 52% 100%); }
  .label { position: absolute; z-index: 2; }
  .icon { position: absolute; z-index: 3; border-radius: 50%; border: 3px solid var(--ink); box-sizing: border-box; }
</style>
</head>
<body>
  <!-- nav tabs -->
  <div class="btn blue"   style="left:330px; top:18px; width:150px; height:50px; transform:skewX(-14deg)"><div class="label t" style="inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; transform:skewX(14deg)">SHOP</div></div>
  <div class="btn red"    style="left:498px; top:18px; width:150px; height:50px; transform:skewX(-14deg)"><div class="label t" style="inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; transform:skewX(14deg)">HOME</div></div>
  <div class="btn yellow" style="left:666px; top:18px; width:150px; height:50px; transform:skewX(-14deg)"><div class="label t" style="inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; transform:skewX(14deg)">ERAS</div></div>
  <!-- objective -->
  <div style="position:absolute; left:290px; top:92px; display:flex; align-items:center; gap:14px">
    <div class="icon" style="position:relative; width:58px; height:58px; background:#ffe0a0"></div>
    <div>
      <div class="t" style="font-size:38px; line-height:1">GET YOUR JEEP</div>
      <div class="t" style="font-size:17px; margin-top:6px; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink)">THE GARAGE IS BEHIND YOUR PLOT</div>
    </div>
  </div>
  <!-- left -->
  <div class="btn green" style="left:22px; top:170px; width:190px; height:56px"><div class="label t" style="left:66px; top:6px; font-size:34px">Dinos</div></div>
  <div class="icon" style="left:8px; top:160px; width:70px; height:70px; background:#f2d27a; border-radius:12px; transform:rotate(-8deg)"></div>
  <div class="btn orange" style="left:22px; top:244px; width:104px; height:104px; border-radius:16px">
    <div class="label t" style="left:0; right:0; bottom:6px; text-align:center; font-size:20px">DRIVE</div>
    <div style="position:absolute; left:14px; top:10px; width:74px; height:60px; background:#5a3a1a; border-radius:10px; z-index:2"></div>
  </div>
  <div class="btn purple" style="left:16px; top:350px; width:124px; height:36px; border-radius:10px"><div class="label t" style="inset:0; display:flex; align-items:center; justify-content:center; font-size:20px">MY JEEPS</div></div>
  <!-- money -->
  <div class="icon" style="left:22px; top:458px; width:78px; height:78px; background:#ffd447; transform:rotate(-10deg)"></div>
  <div class="t" style="position:absolute; left:110px; top:458px; font-size:46px; color:#a8ed48">12.4K</div>
  <div class="btn green" style="left:248px; top:462px; width:44px; height:44px; border-radius:10px"><div class="label t" style="inset:0; display:flex; align-items:center; justify-content:center; font-size:32px">+</div></div>
  <div class="t" style="position:absolute; left:112px; top:514px; font-size:17px; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink)">+46/s from your dinos</div>
  <!-- settings -->
  <div class="btn purple" style="right:16px; top:16px; width:56px; height:56px; border-radius:14px"></div>
</body>
</html>
